name: Harvey Norman Holdings UCP MCP Server
type: MCPServer
generated: '2026-10-21'
method: probed
source: https://www.harveynormanholdings.com.au/api/ucp/mcp
description: Universal Commerce Protocol (UCP) MCP server for the Harvey Norman Holdings online store at www.harveynormanholdings.com.au.
  The store is built on Shopify and its server identifies itself as "universal-commerce" 0.1.0. The endpoint is advertised
  in the store's robots.txt and agents.md, and in its /.well-known/ucp profile. It covers the catalog, carts, checkout and
  orders. This is the group corporate storefront, NOT the consumer site harveynorman.com.au, which sits behind an anti-bot
  challenge.
status: live
deployment:
  mode: remote
  endpoint: https://www.harveynormanholdings.com.au/api/ucp/mcp
  transport: streamable-http
  auth: none
  verified: probed
  auth_note: initialize and tools/list answered without credentials. agents.md requires server-to-server agents to identify
    themselves with Shopify Web Bot Auth and to follow the service authentication requirements. Checkout completion requires
    buyer authorization.
server_info:
  name: universal-commerce
  version: 0.1.0
  protocolVersion: '2025-06-18'
  capabilities:
  - tools
  - prompts
  - resources
  - logging
