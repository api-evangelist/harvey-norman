description: 'Harvey Norman is an Australian retail brand for electrical, computers, furniture, bedding and homewares, operated
  through a franchise system owned by Harvey Norman Holdings Limited (HNHL, ASX: HVN). According to the group''s own company
  overview, HNHL is a public company listed on the Australian Securities Exchange that operates an integrated retail, franchise,
  property and digital system across eight countries, and owns the Harvey Norman, Domayne and Joyce Mayne trademarks, licensing
  them to independent franchisees in Australia. The consumer site harveynorman.com.au is fronted by an anti-bot challenge;
  no public developer portal, API documentation or API contract has been found.'

